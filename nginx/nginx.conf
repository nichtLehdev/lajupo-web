worker_processes 1;

events { worker_connections 1024; }

http {
    server {
        listen 80;

        location /photos/ {
            proxy_pass http://photoprism:2342/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @unauthorized {
            return 403 "You are not authorized to view this page.";
        }


        location = /auth-check/ {
            internal;

            proxy_redirect http://jupo-web:3000/api/clerk-auth-check/ http://jupo-web:3000/api/clerk-auth-check;

            proxy_pass http://jupo-web:3000/api/clerk-auth-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location / {
            proxy_pass http://jupo-web:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
