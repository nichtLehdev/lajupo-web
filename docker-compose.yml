name: lajupo
services:
  app:
    platform: "linux/amd64"
    container_name: jupo-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_live_Y2xlcmsubGFqdXBvLmRlJA"
    working_dir: /app
    image: t3-app
    networks:
      - app-network
    environment:
      - DATABASE_URL=postgresql://postgres:password@localhost:5432/www
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsubGFqdXBvLmRlJA
      - CLERK_SECRET_KEY=

  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    restart: unless-stopped
    depends_on:
      - mariadb
    volumes:
      - "/mnt/onedrive:/photoprism/originals"
      - "photoprism-storage:/photoprism/storage"
    environment:
      PHOTOPRISM_HTTP_PORT: 2342
      PHOTOPRISM_DATABASE_DRIVER: "mysql"
      PHOTOPRISM_DATABASE_SERVER: "mariadb:3306"
      PHOTOPRISM_DATABASE_USER: "photoprism"
      PHOTOPRISM_DATABASE_PASSWORD: "photoprism"
      PHOTOPRISM_AUTH_TOKEN: ""
      PHOTOPRISM_OIDC_URI: ""
      PHOTOPRISM_OIDC_CLIENT: ""
      PHOTOPRISM_OIDC_SECRET: ""
      PHOTOPRISM_OIDC_REGISTER: "true"
      PHOTOPRISM_OIDC_REDIRECT: "true"
    networks:
      - photo-network

  mariadb:
    image: mariadb:10.5
    container_name: mariadb
    restart: unless-stopped
    volumes:
      - "photoprism-database:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: "YOUR_MYSQL_ROOT_PASSWORD"
      MYSQL_DATABASE: "photoprism"
      MYSQL_USER: "photoprism"
      MYSQL_PASSWORD: "photoprism"
    networks:
      - photo-network

  nginx:
    image: nginx:latest
    container_name: jupo-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
      - photo-network
      - Aliases

volumes:
  photoprism-storage:
  photoprism-database:

networks:
  Aliases:
    external: true
  app-network:
  photo-network:
